<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 城探票务</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app" v-cloak>
    <app-header page="login"></app-header>
    <div class="container" style="max-width:460px;padding-top:56px;padding-bottom:80px;">
        <div class="panel">
            <h2 style="margin:0 0 6px;font-size:22px;">登录城探票务</h2>
            <p class="muted" style="margin:0 0 22px;">手机号 + 验证码，未注册手机号会自动创建账号</p>

            <div class="form-row">
                <label>手机号</label>
                <input class="input" v-model.trim="phone" maxlength="11" placeholder="请输入 11 位手机号">
            </div>
            <div class="form-row">
                <label>验证码</label>
                <div class="row">
                    <input class="input" v-model.trim="code" maxlength="6" placeholder="6 位验证码" style="flex:1;">
                    <button class="btn btn-ghost" :disabled="countdown>0 || sending" @click="sendCode"
                            style="white-space:nowrap;">
                        {{ countdown>0 ? countdown + 's' : '获取验证码' }}
                    </button>
                </div>
            </div>
            <button class="btn btn-primary" style="width:100%;margin-top:6px;" :disabled="loading" @click="login">
                {{ loading ? '登录中...' : '登录' }}
            </button>

            <div class="alert alert-blue mt16">
                演示环境没有接短信通道，验证码会打印在服务端控制台。<br>
                运营账号：<b>13800000000</b>（可体验核销台）；普通账号可用任意合法手机号。
            </div>
            <p class="muted mt16" style="margin-bottom:0;text-align:center;">
                <a href="/index.html">先随便逛逛 →</a>
            </p>
        </div>
    </div>
    <app-footer></app-footer>
</div>
<script src="/vendor/vue.js"></script>
<script src="/vendor/axios.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/layout.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            phone: '',
            code: '',
            sending: false,
            countdown: 0,
            loading: false,
            timer: null
        },
        methods: {
            sendCode: function () {
                var self = this;
                if (!/^1[3-9]\d{9}$/.test(this.phone)) {
                    showToast('请输入正确的手机号', 'error');
                    return;
                }
                this.sending = true;
                api.post('/api/auth/code?phone=' + encodeURIComponent(this.phone))
                    .then(function () {
                        showToast('验证码已发送，请查看服务端控制台', 'success');
                        self.countdown = 60;
                        self.timer = setInterval(function () {
                            self.countdown--;
                            if (self.countdown <= 0) {
                                clearInterval(self.timer);
                            }
                        }, 1000);
                    })
                    .catch(function (e) {
                        showToast(e.message, 'error');
                    })
                    .finally(function () {
                        self.sending = false;
                    });
            },
            login: function () {
                var self = this;
                if (!this.phone || !this.code) {
                    showToast('请填写手机号和验证码', 'error');
                    return;
                }
                this.loading = true;
                api.post('/api/auth/login', { phone: this.phone, code: this.code })
                    .then(function (data) {
                        api.saveLogin(data);
                        showToast('登录成功', 'success');
                        var redirect = new URLSearchParams(location.search).get('redirect') || '/index.html';
                        location.href = redirect;
                    })
                    .catch(function (e) {
                        showToast(e.message, 'error');
                    })
                    .finally(function () {
                        self.loading = false;
                    });
            }
        }
    });
</script>
</body>
</html>
