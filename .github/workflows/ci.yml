name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 + 单元测试 + 集成测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chengtan_v2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 确保 mysql 客户端可用
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          mysql --version

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 \
            < src/main/resources/db/chengtan_ticket.sql
          mysql -h 127.0.0.1 -uroot -proot -N -e \
            "SELECT COUNT(*) AS tables_created FROM information_schema.tables WHERE table_schema='chengtan_v2';"

      - name: 构建并运行测试
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DB: chengtan_v2
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: '5672'
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
        run: mvn -B verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
